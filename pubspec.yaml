name: controle_consumo_veiculos
description: Aplicativo offline para controle de consumo de combustivel em cache com exportacao em PDF.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  pdf: ^3.11.1
  printing: ^5.13.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
